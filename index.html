<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oops! Desserts</title>

    <!-- Bulma -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    >
</head>

<body style="background-color: #e3c8bf; min-height: 100vh;">

    <!-- PORTADA -->
    <section class="hero is-medium" style="background-color: #844c68;">
        <div class="hero-body has-text-centered">

            <p class="title is-size-1" style="color: white;">
                Oops! Desserts
            </p>

            <p class="subtitle" style="color: #e3c8bf;">
                ♡ Tu parte favorita del día sabe a postre ♡
            </p>

        </div>
    </section>


    <!-- CONTENIDO -->
    <section class="section">

        <div class="container has-text-centered">

            <h2 class="title" style="color: #2a1107;">
                Pick your treat
            </h2>

            <p class="subtitle" style="color: #844c68;">
                Postres hechos para alegrarte el día 🎀
            </p>

            <div class="box">
                <p>
                    Abre la consola para descubrir nuestro menú,
                    disponibilidad y el total de tu pedido.
                </p>
            </div>

        </div>

    </section>


    <!-- ENLACE CON JAVASCRIPT -->
    <script src="script.js"></script>

</body>

</html>
